name: pre-commit

# A lint gate, not a test run: it runs the pre-commit hooks other than
# rust-check (see the step below for why that one is skipped). Nothing
# in CI builds the firmware or boots it, so the QEMU oracles --
# make digest-payload-smoke, scripts/test.sh,
# scripts/screenshot-modes.sh, scripts/verify-release.sh -- run only on
# a developer's machine. A retest dispatched through pr-retest.yml
# re-runs this workflow, so a green retest means the hooks passed and
# nothing more.

on:
  push:
    branches: [develop]
  pull_request:
  # pr-retest.yml dispatches the workflow named by the RETEST_WORKFLOW
  # repository variable when somebody asks the bot to retest a pull
  # request, and this is the only test workflow here, so it has to be
  # dispatchable. The automated_reviewer job below skips itself on a
  # dispatch run.
  workflow_dispatch:

# The job reads the tree and reports through the check run; it writes
# nothing back to the repository, so the default GITHUB_TOKEN scope is
# narrowed to read-only here rather than per job.
permissions:
  contents: read

jobs:
  pre-commit:
    name: Run the pre-commit hooks
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The runners enforce PEP 668 and refuse a bare pip install, so
      # pre-commit goes in a venv. Under RUNNER_TEMP, with --clear,
      # because a fixed path under /tmp is shared with every other job
      # on a long-lived static runner.
      - name: Install pre-commit
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/venv-pre-commit"
          "${RUNNER_TEMP}/venv-pre-commit/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit

      # The rust-check hook runs rustfmt and clippy inside the
      # project's Docker build image, and that image needs a local
      # named volume for cargo's target directory. Static runners carry
      # no Docker daemon, so the hook is skipped here; rustfmt and
      # clippy still gate every commit locally through pre-commit, and
      # scripts/check-rust.sh runs them with -D warnings. Running them
      # in CI as well wants a debian-13-docker runner and a warmed
      # cargo cache, neither of which this job has.
      - name: Run pre-commit (rust hook skipped)
        env:
          SKIP: rust-check
        run: >-
          "${RUNNER_TEMP}/venv-pre-commit/bin/pre-commit" run --all-files
          --show-diff-on-failure

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/venv-pre-commit"

  # The automatic review, gated on the job above passing: a job skipped
  # because its dependency failed never starts the reusable workflow,
  # so the needs list is the CI-passed gate.
  #
  # No event guard despite the workflow_dispatch trigger above. The
  # reusable workflow's own job carries an
  # `if: github.event_name == 'pull_request'` condition, so a dispatch
  # run skips it cleanly rather than failing on a null pull request.
  #
  # The body lives once, in shakenfist/actions. The permissions block
  # has to be here, because a cross-repository reusable workflow cannot
  # grant itself more token scope than its caller has, and for the same
  # reason this job sets neither runs-on nor timeout-minutes -- the
  # reusable workflow defines both. Deliberately no secrets: inherit:
  # nothing in the reviewer chain reads a secret, so inheriting would
  # hand every secret this repository holds to a workflow in another
  # one for no benefit.
  automated_reviewer:
    name: "Automated reviewer"
    needs: [pre-commit]
    permissions:
      contents: read
      pull-requests: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
