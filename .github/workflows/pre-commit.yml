name: pre-commit

on:
  push:
    branches: [develop]
  pull_request:

# The job reads the tree and reports through the check run; it writes
# nothing back to the repository, so the default GITHUB_TOKEN scope is
# narrowed to read-only here rather than per job.
permissions:
  contents: read

jobs:
  pre-commit:
    name: Run the pre-commit hooks
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The runners enforce PEP 668 and refuse a bare pip install, so
      # pre-commit goes in a venv. Under RUNNER_TEMP, with --clear,
      # because a fixed path under /tmp is shared with every other job
      # on a long-lived static runner.
      - name: Install pre-commit
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/venv-pre-commit"
          "${RUNNER_TEMP}/venv-pre-commit/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit

      # The rust-check hook runs rustfmt and clippy inside the
      # project's Docker build image, and that image needs a local
      # named volume for cargo's target directory. Static runners carry
      # no Docker daemon, so the hook is skipped here; rustfmt and
      # clippy still gate every commit locally through pre-commit, and
      # scripts/check-rust.sh runs them with -D warnings. Running them
      # in CI as well wants a debian-13-docker runner and a warmed
      # cargo cache, neither of which this job has.
      - name: Run pre-commit (rust hook skipped)
        env:
          SKIP: rust-check
        run: >-
          "${RUNNER_TEMP}/venv-pre-commit/bin/pre-commit" run --all-files
          --show-diff-on-failure

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/venv-pre-commit"
