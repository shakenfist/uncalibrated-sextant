repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Cargo.lock is a generated lockfile; leave it for cargo to manage.
        exclude: ^Cargo\.lock$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/
        types_or: [sh, bash, shell]
        args: ['-x']

  # AGENTS.md and the plan template are read into every agent session,
  # so a malformed heading, a smuggled unicode character or a secret
  # pasted into them is a defect in the commit that introduces it
  # rather than something for the weekly fleet audit to find. skillsaw
  # lints them here, and .github/workflows/pre-commit.yml runs every
  # hook in this file, so --no-verify does not get past it.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.22.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
