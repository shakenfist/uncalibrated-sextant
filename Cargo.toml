[package]
name = "uncalibrated-sextant"
version = "0.0.1"
edition = "2021"
description = "SPICE channel exercise harness for shakenfist/ryll"
license = "Apache-2.0"
publish = false

[dependencies]
uefi = { version = "=0.37.0", features = ["panic_handler", "alloc", "global_allocator"] }
qrcodegen-no-heap = "1.8.1"
crc = { version = "3", default-features = false }

[features]
default = []
# Inject a hard-coded `draw_digest(b"hello")` call into
# `Scene::run_awaiting`, so the `make digest-smoke` target can boot
# headless, screendump the AWAITING frame, and decode the QR with
# zbarimg. Off by default; no production behaviour change.
digest-smoke = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
panic = "abort"
