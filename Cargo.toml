[package]
name = "uncalibrated-sextant"
version = "0.0.1"
edition = "2021"
description = "SPICE channel exercise harness for shakenfist/ryll"
license = "Apache-2.0"
publish = false

[dependencies]
uefi = { version = "=0.37.0", features = ["panic_handler", "alloc", "global_allocator"] }
qrcodegen-no-heap = "1.8.1"
crc = { version = "3", default-features = false }
shakenfist-visual-digest = { git = "https://github.com/shakenfist/visual-digest-rust", rev = "dd9a9348f6a9cb286988b5c8498371399471d0cd", default-features = false }

# unwrap() turns a recoverable error into a panic, and this firmware
# reads framebuffer geometry, SPICE input and host-supplied payloads
# from outside itself; a panic there is a wedged guest with no console
# to report from. warn here plus -D warnings in scripts/check-rust.sh
# means a refactor is not blocked mid-edit while nothing lands with a
# new production unwrap. clippy.toml exempts test code.
[lints.clippy]
unwrap_used = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
panic = "abort"
